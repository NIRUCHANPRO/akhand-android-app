name: Auto Build Akhand Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Generate Complete Android + Real AdMob Project
        run: |
          mkdir -p android_build/app/src/main/java/com/akhand/ebookstudio
          mkdir -p android_build/app/src/main/res/drawable
          cd android_build

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AkhandEBookStudio"
          include ':app'
          EOF

          # 3. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.akhand.ebookstudio'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akhand.ebookstudio"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-ads:22.6.0'
          }
          EOF

          # 5. App Icon (Uses logo.png if uploaded, else Neon Lightning Logo)
          if [ -f "../logo.png" ]; then
            cp ../logo.png app/src/main/res/drawable/ic_launcher.png
          else
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#7C3AED"
                  android:pathData="M18,18 L90,18 A12,12 0 0,1 102,30 L102,90 A12,12 0 0,1 90,102 L18,102 A12,12 0 0,1 6,90 L6,30 A12,12 0 0,1 18,18 Z"/>
              <path
                  android:fillColor="#22D3EE"
                  android:pathData="M60,20 L30,58 L52,58 L46,88 L78,48 L56,48 Z"/>
          </vector>
          EOF
          fi

          # 6. AndroidManifest.xml with Real AdMob App ID
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="Akhand Studio"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <!-- REAL ADMOB APP ID -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3795083504643929~6953318866"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 7. MainActivity.java with Real Banner & Rewarded Ad IDs
          cat << 'EOF' > app/src/main/java/com/akhand/ebookstudio/MainActivity.java
          package com.akhand.ebookstudio;

          import android.app.DownloadManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ProgressBar progressBar;
              private RewardedAd mRewardedAd;
              private final String STUDIO_URL = "https://automaticebookmaker.netlify.app";

              // REAL ADMOB BANNER & REWARDED AD UNIT IDS
              private final String BANNER_AD_UNIT_ID = "ca-app-pub-3795083504643929/6406076846";
              private final String REWARDED_AD_UNIT_ID = "ca-app-pub-3795083504643929/8773666995";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.parseColor("#030712"));
                  getWindow().setNavigationBarColor(Color.parseColor("#030712"));

                  MobileAds.initialize(this, initializationStatus -> {});
                  loadRewardedVideoAd();

                  LinearLayout rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.setBackgroundColor(Color.parseColor("#030712"));

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 8));
                  progressBar.setMax(100);

                  webView = new WebView(this);
                  LinearLayout.LayoutParams webParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f);
                  webView.setLayoutParams(webParams);
                  webView.setBackgroundColor(Color.parseColor("#030712"));

                  AdView adView = new AdView(this);
                  adView.setAdSize(AdSize.BANNER);
                  adView.setAdUnitId(BANNER_AD_UNIT_ID);
                  adView.loadAd(new AdRequest.Builder().build());

                  FrameLayout bannerContainer = new FrameLayout(this);
                  bannerContainer.setBackgroundColor(Color.parseColor("#030712"));
                  bannerContainer.addView(adView);

                  rootLayout.addView(progressBar);
                  rootLayout.addView(webView);
                  rootLayout.addView(bannerContainer);
                  setContentView(rootLayout);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.addJavascriptInterface(new AdMobBridge(), "AndroidAdMob");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.contains("automaticebookmaker.netlify.app")) {
                              return false;
                          } else {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          }
                      }
                  });

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setMimeType(mimeType);
                      String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                      request.setTitle(fileName);
                      request.setDescription("Downloading E-Book PDF...");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      if (dm != null) dm.enqueue(request);
                      Toast.makeText(getApplicationContext(), "Downloading E-Book PDF...", Toast.LENGTH_LONG).show();
                  });

                  webView.loadUrl(STUDIO_URL);
              }

              private void loadRewardedVideoAd() {
                  AdRequest adRequest = new AdRequest.Builder().build();
                  RewardedAd.load(this, REWARDED_AD_UNIT_ID, adRequest, new RewardedAdLoadCallback() {
                      @Override
                      public void onAdFailedToLoad(@NonNull LoadAdError loadAdError) {
                          mRewardedAd = null;
                      }

                      @Override
                      public void onAdLoaded(@NonNull RewardedAd ad) {
                          mRewardedAd = ad;
                      }
                  });
              }

              public class AdMobBridge {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(() -> {
                          if (mRewardedAd != null) {
                              mRewardedAd.show(MainActivity.this, rewardItem -> {
                                  webView.evaluateJavascript("creditAdRewardToServer();", null);
                                  loadRewardedVideoAd();
                              });
                          } else {
                              Toast.makeText(MainActivity.this, "Video Ad taiyar ho raha hai (New Ad Unit takes ~1 hr)...", Toast.LENGTH_SHORT).show();
                              loadRewardedVideoAd();
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compile Android APK
        working-directory: android_build
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Akhand-Studio-Pro-APK
          path: android_build/app/build/outputs/apk/debug/app-debug.apk
